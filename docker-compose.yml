version: "3.9"
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: waiter_jobs
    ports: ["3307:3306"]
    volumes:
      - db_data:/var/lib/mysql

  app1: &app
    build: .
    environment:
      # after_install.sh will ensure settings.json is correct
    depends_on: [mysql]
  app2:
    <<: *app
  app3:
    <<: *app

  nginx:
    image: nginx:1.27
    ports: ["80:80"]
    depends_on: [app1, app2, app3]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  db_data:
